name: Build DaroYab APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: |
          npx cap add android || echo "android platform already added"
          npx cap sync android

      - name: Allow cleartext HTTP
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' $MAN || sed -i '0,/<application/s//<application\n        android:usesCleartextTraffic="true"/' $MAN
          grep -o 'usesCleartextTraffic="true"' $MAN

      - name: Install SslBypass plugin (trust gov cert)
        run: |
          DEST=android/app/src/main/java/ir/daroyab/app
          mkdir -p $DEST
          cp android-patch/ir/daroyab/app/SslBypassPlugin.java $DEST/
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          cat $MAIN
          python3 - <<'PYEOF'
import re, glob
p = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)[0]
s = open(p).read()
if 'SslBypassPlugin' not in s:
    s = s.replace('import com.getcapacitor.BridgeActivity;',
                  'import com.getcapacitor.BridgeActivity;\nimport ir.daroyab.app.SslBypassPlugin;')
    s = s.replace('super.onCreate(savedInstanceState);',
                  'super.onCreate(savedInstanceState);\n        registerPlugin(SslBypassPlugin.class);')
    open(p,'w').write(s)
print("MainActivity patched")
PYEOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DaroYab-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaroYab-v1.0-apk
          path: DaroYab-v1.0.apk
          retention-days: 30
