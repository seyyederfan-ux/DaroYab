    const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

    function toPersianNum(num) {
      if (num === null || num === undefined) return '';
      return num.toString().replace(/\d/g, x => persianDigits[parseInt(x, 10)]);
    }

    function formatPrice(amount) {
      if (typeof amount !== 'number') return toPersianNum(amount);

    // 4. APPLICATION STATE (persisted in localStorage)
    var API_BASE = 'https://daroyab-api.erfan-api.workers.dev'; // live Worker (deployed)
    var LS_KEYS = { saved: 'daroyab.savedIds', theme: 'daroyab.theme', cache: 'daroyab.medicinesCache' };

    function isNative() {
      // Capacitor WebView / Android WebView detection
      return !!(window.Capacitor && window.Capacitor.isNativePlatform) ||
             /; wv\)/.test(navigator.userAgent); // Android WebView UA
    }

    function lsGet(key, fallback) {
      try { var v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    }
    function lsSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
    }

    var state = {
      activeTab: 'home',
      selectedCategory: 'all',
      searchQuery: '',
      savedIds: lsGet(LS_KEYS.saved, [1, 3, 5, 8]),
      activeDetailDrugId: null
    };

    // restore theme
    (function restoreTheme() {
      var t = lsGet(LS_KEYS.theme, null);
      if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.classList.remove('light'); }
      else if (t === 'light') { document.documentElement.classList.add('light'); document.documentElement.classList.remove('dark'); }
    })();

    // 4b. LIVE BACKEND FETCH + OFFLINE CACHE + FALLBACK
    var searchDebounceTimer = null;
    var liveMedicines = null; // null = not loaded, [] = loaded-empty/failed

    function skeletonCards(n) {
      var card = '<div class="p-3 rounded-2xl bg-white dark:bg-slate-800/70 border border-slate-200/90 dark:border-white/[0.08] flex items-center gap-3 animate-pulse">'
        + '<div class="w-12 h-12 rounded-2xl bg-slate-200 dark:bg-slate-700 shrink-0"></div>'
        + '<div class="flex-1 space-y-2"><div class="h-3 bg-slate-200 dark:bg-slate-700 rounded w-3/4"></div>'
        + '<div class="h-2.5 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>'
        + '<div class="h-2.5 bg-slate-200 dark:bg-slate-700 rounded w-1/3"></div></div>'
        + '<div class="w-16 h-8 rounded-xl bg-slate-200 dark:bg-slate-700 shrink-0"></div></div>';
      return Array(n).fill(card).join('');
    }

    function showSkeleton() {
      var container = document.getElementById('medicine-list');
      container.innerHTML = skeletonCards(6);
    }

    async function fetchMedicines(query) {
      // network-first with cache fallback, then built-in MEDICINES
      var url = API_BASE + '/api/medicines?category=' + encodeURIComponent(state.selectedCategory);
      if (query) url += '&q=' + encodeURIComponent(query);

      try {
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, 8000);
        var res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(t);
        var data = await res.json();
        if (data.ok && Array.isArray(data.medicines) && data.medicines.length > 0) {
          liveMedicines = data.medicines;
          lsSet(LS_KEYS.cache, { ts: Date.now(), medicines: data.medicines });
          return data.medicines;
        }
        throw new Error('empty');
      } catch (e) {
        // offline → localStorage cache → built-in fallback
        var cached = lsGet(LS_KEYS.cache, null);
        if (cached && Array.isArray(cached.medicines) && cached.medicines.length) {
          return cached.medicines.filter(med => matchFilter(med, query));
        }
        return MEDICINES.filter(med => matchFilter(med, query));
      }
    }

    function matchFilter(med, query) {
      var matchesCat = state.selectedCategory === 'all' || med.category === state.selectedCategory;
      var q = (query || '').toLowerCase();
      var matchesQuery = !q ||
        med.faName.toLowerCase().includes(q) ||
        med.enName.toLowerCase().includes(q) ||
        (med.manufacturer || '').toLowerCase().includes(q) ||
        (med.ircCode || '').includes(q);
      return matchesCat && matchesQuery;
    }

    function handleSearchDebounced(value) {
      handleSearch(value);
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(async function () {
        showSkeleton();
        var results = await fetchMedicines(state.searchQuery);
        renderMedicineListFrom(results);
      }, 300);
    }

    function currentDataset() {
      return (liveMedicines && liveMedicines.length) ? liveMedicines : MEDICINES;
    }

      state.selectedCategory = catId;

    function handleSearch(query) {
      state.searchQuery = query.trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (state.searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');

      const input = document.getElementById('search-input');
      input.value = '';

      document.getElementById('clear-search-btn').classList.add('hidden');

            <span class="font-bold text-slate-800 dark:text-slate-100">${formatPrice(med.unitPrice)} تومان</span>
          </div>
          <div class="px-3.5 py-2.5 flex items-center justify-between text-xs">
            <span class="text-slate-500 dark:text-slate-400 font-medium">قیمت بسته کامل (${med.packDesc}):</span>
            <span class="font-bold text-slate-800 dark:text-slate-100">${formatPrice(med.packPrice)} تومان</span>
          </div>
          <div class="px-3.5 py-2.5 flex items-center justify-between text-xs">
            <span class="text-slate-500 dark:text-slate-400 font-medium">وضعیت تحویل در داروخانه:</span>
            <span class="font-bold ${med.rxRequired ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}">
              ${med.rxRequired ? 'نیازمند نسخه پزشک (Rx)' : 'تحویل بدون نسخه (OTC)'}
            </span>
          </div>
        </div>

        <!-- Primary Action Buttons -->
        <div class="pt-1 flex items-center gap-2.5">
          <button 
            onclick="toggleSaveMedicine(${med.id})"
            class="flex-1 py-3.5 px-4 rounded-2xl bg-gradient-to-l from-[#0D9488] to-[#10B981] text-white font-black text-xs shadow-float active:scale-[0.98] transition-all flex items-center justify-center gap-2"
          >
            <svg class="w-4 h-4" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
            <span>${isSaved ? 'حذف از داروهای من' : 'نشان کردن و ذخیره دارو'}</span>
          </button>
          <button 
            onclick="closeDetailSheet()"
            class="py-3.5 px-5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold text-xs active:scale-95 transition-all"
          >
            بستن
          </button>
        </div>
      `;

      const backdrop = document.getElementById('detail-backdrop');
      const sheet = document.getElementById('detail-sheet');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        sheet.classList.remove('sheet-exit');
        sheet.classList.add('sheet-enter');
      });
    }

    function closeDetailSheet() {
      const backdrop = document.getElementById('detail-backdrop');
      const sheet = document.getElementById('detail-sheet');
      backdrop.classList.add('opacity-0');
      sheet.classList.remove('sheet-enter');
      sheet.classList.add('sheet-exit');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 280);
    }

    // 10. SAVED / BOOKMARKS LOGIC
    function toggleSaveMedicine(drugId) {
      const idx = state.savedIds.indexOf(drugId);
      const med = MEDICINES.find(m => m.id === drugId);
      if (idx > -1) {
        state.savedIds.splice(idx, 1);
        showToast(`«${med.faName}» از داروهای من حذف شد`);
      } else {
        state.savedIds.push(drugId);
        showToast(`«${med.faName}» در داروهای من ذخیره شد`);
      }
      lsSet(LS_KEYS.saved, state.savedIds);
      updateAllViews();
      if (state.activeDetailDrugId === drugId) {
        openDetailSheet(drugId);
      }
    }

    function renderSavedMedicines() {
      const container = document.getElementById('saved-medicines-list');
      const savedBadge = document.getElementById('nav-saved-badge');
      savedBadge.textContent = toPersianNum(state.savedIds.length);

      if (state.savedIds.length === 0) {
        container.innerHTML = `
          <div class="py-12 px-4 text-center bg-white dark:bg-slate-800/50 rounded-3xl border border-dashed border-slate-200 dark:border-white/10">
            <p class="text-xs font-bold text-slate-700 dark:text-slate-200">هنوز دارویی نشان نکرده‌اید</p>
            <p class="text-[11px] text-slate-400 mt-1">با زدن دکمه نشان در کنار هر دارو، آن را در این بخش ذخیره کنید</p>
          </div>
        `;
        return;
      }

      const savedList = MEDICINES.filter(m => state.savedIds.includes(m.id));
      container.innerHTML = savedList.map(med => {
        const iconStyle = getDosageFormBadge(med.form);
        const isUp = med.priceTrend === 'up';

        return `
          <div 
            onclick="openDetailSheet(${med.id})"
            class="p-3.5 rounded-2xl bg-white dark:bg-slate-800/70 border border-slate-200/90 dark:border-white/[0.08] flex items-center justify-between gap-3 active:scale-[0.98] transition-all cursor-pointer shadow-sm"
          >
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-11 h-11 rounded-2xl border ${iconStyle.bg} flex items-center justify-center shrink-0">
                ${iconStyle.svg}
              </div>
              <div class="min-w-0">
                <h4 class="text-xs font-black text-slate-800 dark:text-white truncate">${med.faName}</h4>
                <div class="flex items-center gap-1.5 mt-1">
                  <span class="text-[11px] font-black text-teal-600 dark:text-teal-400">${formatPrice(med.packPrice)} تومان</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${
                    isUp 
                      ? 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20' 
                      : 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20'
                  }">
                    ${med.trendText}
                  </span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button 
                onclick="event.stopPropagation(); toggleSaveMedicine(${med.id})"
                class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 flex items-center justify-center active:scale-90 transition-all"
                title="حذف از نشان‌شده‌ها"
              >
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 11. NAVIGATION TAB SWITCHING
    function switchTab(tabId) {
      state.activeTab = tabId;
      const views = ['home', 'saved'];
      views.forEach(v => {
        const section = document.getElementById(`view-${v}`);
        const btn = document.getElementById(`nav-${v}`);
        if (v === tabId) {
          section.classList.remove('hidden');
          btn.className = 'nav-btn relative flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-teal-600 dark:text-teal-400 bg-teal-500/10 font-bold transition-all active:scale-95';
        } else {
          section.classList.add('hidden');
          btn.className = 'nav-btn relative flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 font-medium transition-all active:scale-95';
        }
      });
      updateAllViews();
    }

    // 12. DARK / LIGHT THEME TOGGLE (persisted)
    function toggleTheme() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        lsSet(LS_KEYS.theme, 'light');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        lsSet(LS_KEYS.theme, 'dark');
      }
    }

    // 13b. NATIVE WEBVIEW PREP: strip desktop bezel, fill real screen
    function applyNativeLayout() {
      if (!isNative()) return;
      document.getElementById('device-frame').className =
        'relative w-full h-screen bg-[#F8FAFC] dark:bg-[#0B0F19] overflow-hidden flex flex-col transition-all duration-300';
      var sb = document.getElementById('fake-statusbar');
      if (sb) sb.classList.add('hidden');
      document.body.className = document.body.className.replace('bg-slate-200 dark:bg-slate-950 flex items-center justify-center min-h-screen sm:p-4', 'bg-[#F8FAFC] dark:bg-[#0B0F19]');
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
        try {
          var dark = document.documentElement.classList.contains('dark');
          window.Capacitor.Plugins.StatusBar.setBackgroundColor({ color: dark ? '#0B0F19' : '#0D9488' });
        } catch (e) {}
      }
    }

    // 13c. ANDROID HARDWARE BACK BUTTON
    function setupBackButton() {
      var handler = function () {
        var sheetOpen = !document.getElementById('detail-sheet').classList.contains('sheet-exit')
                        && !document.getElementById('detail-backdrop').classList.contains('hidden');
        if (sheetOpen) { closeDetailSheet(); return; }
        if (state.activeTab !== 'home') { switchTab('home'); return; }
        // nothing to close: move app to background (default behavior)
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
          window.Capacitor.Plugins.App.exitApp();
        }
      };
      document.addEventListener('backbutton', handler, false); // Cordova-style
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.addListener('backButton', handler);
      }
      window.addEventListener('keydown', function (e) { if (e.key === 'Escape') handler(); });
    }

    // 13. CLIPBOARD & TOAST HELPERS
    function copyText(text, successMsg) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (e) {
        showToast('کپی انجام شد');
      }
      document.body.removeChild(textarea);
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      msgEl.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2400);
    }

    function updateAllViews() {
      renderMedicineList();
      renderSavedMedicines();
    }

    // 14. INITIALIZE APPLICATION ON LOAD
    window.onload = function() {
      applyNativeLayout();
      setupBackButton();
      renderCategories();
      updateAllViews();
      // initial live load (skeleton while fetching)
      showSkeleton();
      fetchMedicines('').then(function (results) {
        renderMedicineListFrom(results);
      });
    };
  </script>
</body>
</html>
